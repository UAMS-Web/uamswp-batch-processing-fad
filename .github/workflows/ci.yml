name: CI

# RUN_REMOTE_CI: budget kill-switch.
# GitHub Actions minutes bill at the organization level, one pool shared by
# every UAMS-Web repository, and only private repositories consume them. This
# repository is private. The call, the `JS tests` job and the `CI` job below are gated on
# `if: vars.RUN_REMOTE_CI != 'false'`: with the variable set to `false` they
# report `skipped` and consume no runner minutes; unset, or any other value,
# runs them as before.
#
# While the switch is off, the local CI runner (.claude/skills/local-ci/) is
# the whole gate, not a fallback. Its verdict is posted on the pull request.
#
# The lint and unit chain is the shared one, `UAMS-Web/uams-ci-workflows`, called by the
# `checks` job. One definition serves every UAMS-Web repository, so this plugin does not
# carry a copy that drifts. The call runs on Linux only, switches on the two jobs only a
# plugin runs (`floor-lint`, `download-archive`), runs mutation testing and the `mutate-ignore`
# audit over `includes`, `fad` and the plugin file (`mutate-paths`, `mutate-ignore-paths`), and
# runs the plugin's unit suite as `composer test:unit`. A pull request or a push mutates only the
# changed files under `mutate-paths`; a `workflow_dispatch` mutates everything `composer mutate` covers.
# `phpcs` stays off: this plugin has no PHPCS configuration. The chain's own header lists
# every input and its default; pass only inputs the pinned tag declares.
#
# The last job, `CI`, is the one check a ruleset requires from this workflow (with the two
# pull-request-body checks, `Attribution footer` and `Closing keywords`). It `needs:` the
# call and the `JS tests` job, runs `if: always()` while the switch is on, and fails unless
# each of them reports `success`: a `skipped` or `cancelled` one fails it. The call ends in a `Chain result` job
# that needs every job in the chain, so `checks` is `success` only when each of them
# succeeded. Adding a plain job here means adding it to the `needs:` list of `CI`; the
# `aggregate-needs` job in the chain fails the pull request when one is missing. Do not
# rename `CI`, and do not rename `checks` without changing `needs:` below.
#
# What the plugin carries for the call, because the called jobs check out this repository:
# `.github/actions/setup/action.yml`, the synced `.claude/skills` scripts, the Composer
# scripts `test:pint`, `test:refactor`, `stan`, `test:unit` and `mutate`, and `scripts/lint-floor.php`.

on:
  pull_request:
  push:
    branches: [master]
  # The full mutation pass, weekly (Mondays 07:23 UTC), on the default branch. A scheduled run
  # mutates everything `composer mutate` covers, under the chain's `mutate-full-timeout-minutes`
  # (default 180); a pull request or a push keeps the 45-minute cap on changed files. The call
  # is gated on `RUN_REMOTE_CI` like every other event, so with the switch off a scheduled run
  # reports `skipped`.
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run. Every other run gets a
# group of its own, keyed on the commit, so a later push never cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared chain. Its checks report as `checks / <job name> (<operating system>)`.
  checks:
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    # Pinned to a release tag, never a branch or a commit, so a change to the chain reaches this
    # plugin only when the pin moves. v0.13.0 declares every input passed below.
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.13.0
    with:
      linux-only: true
      mutate-paths: includes fad uamswp-batch-processing.php
      mutate-ignore-paths: includes fad
      floor-lint: true
      floor-lint-php: '8.2'
      download-archive: true
      download-archive-command: node .claude/skills/download-archive-check/check-download-archive.mjs
      pest-command: composer test:unit

  # The batch screen's runner, assets/processor.js. Its tests use Node's own test runner and no
  # packages, so the job installs nothing; the runner image's Node is enough (18 or later).
  js:
    name: JS tests
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: vars.RUN_REMOTE_CI != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the runner's tests
        run: |
          node --version
          node --test tests/js/*.test.mjs

  # The one check a ruleset requires from this workflow. Keep `needs:` naming the call and every job.
  ci:
    name: CI
    needs: [checks, js]
    # Budget kill-switch: see the RUN_REMOTE_CI note in the header.
    if: always() && vars.RUN_REMOTE_CI != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a call that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
